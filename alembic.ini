[alembic]
script_location = migrations
file_template = %%(year)d%%(month)02d%%(day)02d_%%(rev)s_%%(slug)s
prepend_sys_path = .

# The database URL intentionally does NOT live here: migrations/env.py
# resolves it from ALEMBIC_DATABASE_URL or the app settings, so real
# credentials never land in a tracked file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
