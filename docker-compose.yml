services:
  db:
    image: postgres:18-alpine
    environment:
      # Interpolated from the project .env (compose reads it automatically).
      # The rag/rag fallback is a DEV-ONLY credential for a 127.0.0.1-bound
      # container; override POSTGRES_PASSWORD in .env for anything real, and
      # keep DATABASE_URL/TEST_DATABASE_URL in sync when you do.
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      # Host 5433: a locally installed Windows PostgreSQL often occupies 5432;
      # this compose DB never fights it for the default port.
      # Host 5433 (5432 is taken by a local Windows PostgreSQL). Loopback-only
      # binding is the goal (see docs/dev-testing.md), but this Docker Desktop
      # install currently STALLS IPv4-loopback publishes (SELECT 1 took 130 s;
      # bare binding takes 1.4 s) — pending a Docker Desktop restart to clear
      # the relay state. Revert to "127.0.0.1:5433:5432" after that restart.
      - "5433:5432"
    volumes:
      # PG18 image layout: mount the parent dir; data lands in 18/docker/,
      # leaving room for pg_upgrade of future major versions.
      - pgdata:/var/lib/postgresql
      # Creates the companion rag_test database used by the test suite.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
