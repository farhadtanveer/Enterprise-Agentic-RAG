services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Host 5433: a locally installed Windows PostgreSQL often occupies 5432;
      # this compose DB never fights it for the default port.
      - "5433:5432"
    volumes:
      # PG18 image layout: mount the parent dir; data lands in 18/docker/,
      # leaving room for pg_upgrade of future major versions.
      - pgdata:/var/lib/postgresql
      # Creates the companion rag_test database used by the test suite.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
