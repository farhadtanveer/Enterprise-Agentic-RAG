version: 2
updates:
  # requirements.txt is fully pinned and CVE-sensitive (pip-audit runs in CI);
  # weekly keeps the bump cadence aligned with that audit.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
