name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests run against real Postgres — never SQLite (JSONB/inet/enums/
    # uuidv7 must behave exactly as deployed; docs/dev-testing.md).
    services:
      postgres:
        # P1 (docs/tasks/pgvector-p1.md): official PG18 + the pgvector
        # extension. Alpine→Debian collations differ — CI boots a FRESH
        # cluster every run, so no dump/restore path applies here (that is
        # the operator's docs/db-image-swap.md concern only).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5433/rag_test
    steps:
      - uses: actions/checkout@v4
      # P1: CI boots a fresh cluster with NO initdb mount (Actions services
      # cannot mount files), so the extension + roles come from the SAME
      # idempotent file the operator uses (scripts/sql/
      # bootstrap-existing.sql — docs/db-image-swap.md, no drift). The
      # password values are CI-throwaway creds for a container that dies
      # with the job (same posture as POSTGRES_PASSWORD: rag above); the
      # roles stay UNUSED until P4.
      - name: Bootstrap pgvector extension + roles (bootstrap-existing.sql)
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client &&
          PGPASSWORD=rag psql -h localhost -p 5433 -U rag -d rag_test
          -v ON_ERROR_STOP=1 -v owner_pw=ci-throwaway -v app_pw=ci-throwaway
          -f scripts/sql/bootstrap-existing.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (LLM/Tavily/Pinecone mocked, real Postgres, no API keys)
        run: python -m pytest tests -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Scan pinned dependencies for known CVEs
        run: pip-audit -r requirements.txt

  sast:
    # Static application security testing (security-review follow-up):
    # both gates FAIL ONLY ON HIGH-SEVERITY findings — lower severities are
    # triaged in docs/review/security-review.md and the code comments.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install bandit
        run: pip install bandit==1.9.4
      - name: Bandit — fail on high severity only
        run: bandit -r app --severity-level high --confidence-level medium
      - name: Semgrep — fail on high (ERROR) severity only
        # pinned image tag: semgrep has no pip release for Windows dev
        # machines; the registry ruleset (p/default) with --severity ERROR
        # gates the high tier. Suppressions in code carry a JUSTIFIED
        # comment explaining why the finding is a false positive.
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.183.0
          semgrep scan --config p/default --severity ERROR --error --quiet /src/app
